- model: "capabilities.capability"
  pk: 1
  fields:
    name: mapper.projects
    description: Number of map projects a user may create
- model: "capabilities.capability"
  pk: 2
  fields:
    name: mapper.rows_per_project
    description: Number of rows a single map project may declare
- model: "capabilities.capability"
  pk: 3
  fields:
    name: mapper.match_operations
    description: Number of concept-match operations (rows x algorithms)
- model: "capabilities.capability"
  pk: 4
  fields:
    name: ai_assistant.calls
    description: Number of Mapper AI Assistant invocations
# The preview group's starting GroupCapability limits are NOT defined here: this file is
# reloaded by `loaddata core/fixtures/*` on every container start (pre_startup.sh), and a
# fixture row always overwrites the DB - which would silently revert any runtime tuning of
# the preview group's own caps (e.g. via the Django admin) back to these starting values on
# the next restart. They're seeded once, non-destructively, by `manage.py
# seed_group_capabilities` (core/capabilities/management/commands/seed_group_capabilities.py),
# which pre_startup.sh also runs.
